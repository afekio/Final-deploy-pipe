---
- name: Install operating system prerequisites
  ansible.builtin.package:
    name:
      - curl
      - ca-certificates
      - iptables
      - tar
    state: present

- name: Set timezone to jerusalem
  ansible.builtin.timezone:
    name: Asia/Jerusalem

- name: set rtc to true
  ansible.builtin.command: timedatectl set-local-rtc 1
  
- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Persist required kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/rke2.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"

- name: Configure Kubernetes sysctl values
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop:
    - { name: net.bridge.bridge-nf-call-iptables, value: "1" }
    - { name: net.bridge.bridge-nf-call-ip6tables, value: "1" }
    - { name: net.ipv4.ip_forward, value: "1" }