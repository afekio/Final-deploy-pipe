---
- name: Install operating system prerequisites
  ansible.builtin.package:
    name:
      - curl
      - ca-certificates
      - iptables
      - tar
    state: present

- name: Set timezone to jerusalem
  ansible.builtin.timezone:
    name: Asia/Jerusalem

- name: set rtc to true
  ansible.builtin.command: timedatectl set-local-rtc 1

- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Persist required kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/rke2.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"

- name: Configure Kubernetes sysctl values and ENABLE IPv6
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop:
    - { name: net.bridge.bridge-nf-call-iptables, value: "1" }
    - { name: net.bridge.bridge-nf-call-ip6tables, value: "1" }
    - { name: net.ipv4.ip_forward, value: "1" }
    # --- Enable IPv6 at OS level ---
    - { name: net.ipv6.conf.all.disable_ipv6, value: "0" }
    - { name: net.ipv6.conf.default.disable_ipv6, value: "0" }
    - { name: net.ipv6.conf.lo.disable_ipv6, value: "0" }
    - { name: net.ipv6.conf.all.forwarding, value: "1" }

- name: Verify IPv6 internet connectivity
  ansible.builtin.command: ping6 -c 3 ipv6.google.com
  register: ipv6_ping_result
  failed_when: false
  changed_when: false

- name: Report IPv6 connectivity status
  ansible.builtin.debug:
    msg: >
      {% if ipv6_ping_result.rc == 0 %}
      SUCCESS: IPv6 is fully operational! No band-aids needed.
      {% else %}
      WARNING: IPv6 enabled in OS, but network is unreachable. Check Router/ISP.
      {% endif %}