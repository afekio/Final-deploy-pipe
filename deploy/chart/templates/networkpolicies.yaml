# ==========================
# POSTGRES NETWORK POLICIES
# ==========================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Values.namespacePrefix }}-postgres
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-traffic
  namespace: {{ .Values.namespacePrefix }}-postgres
spec:
  # Using an empty podSelector here applies the rules to ALL CloudNativePG pods (instances, poolers, etc.)
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    # 1. Allow internal CNPG traffic and Operator traffic
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespacePrefix }}-postgres
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
          
    # 2. Allow Application traffic (Auth & Backend)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespacePrefix }}-auth
          podSelector:
            matchLabels:
              app: auth
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespacePrefix }}-backend
          podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 5432
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespacePrefix }}-postgres
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443