  namespace: {{ .Values.namespacePrefix }}-auth
spec:
  podSelector:
    matchLabels:
      app: auth
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespacePrefix }}-frontend
          podSelector:
            matchLabels:
              app: frontend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespacePrefix }}-backend
          podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 5001
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespacePrefix }}-monitoring
  egress:
    # Allow DNS globally
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow DB Traffic
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespacePrefix }}-postgres
      ports:
        - protocol: TCP
          port: 5432

