# ==========================
# POSTGRES NETWORK POLICIES
# ==========================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Values.namespacePrefix }}-postgres
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-traffic
  namespace: {{ .Values.namespacePrefix }}-postgres
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespacePrefix }}-postgres
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000               
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespacePrefix }}-auth
          podSelector:
            matchLabels:
              app: auth
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespacePrefix }}-backend
          podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespacePrefix }}-monitoring
  egress:
    # Allow ALL outbound traffic for Postgres Operator (K8s API, DNS, webhooks)
    - {}

