apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-conf
  namespace: {{ .Values.namespacePrefix }}-frontend
data:
  default.conf: |
    server {
                listen 8080;
        server_name _;
        
        root /usr/share/nginx/html;
        index index.html;
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        location ~ ^/api/(login|register|user|auth|logout) {
            proxy_pass http://auth.{{ .Values.namespacePrefix }}-auth.svc.cluster.local:5001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ~ ^/api/(provision|transactions|ai|log_error|backend) {
            proxy_pass http://backend.{{ .Values.namespacePrefix }}-backend.svc.cluster.local:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /auth/health {
            proxy_pass http://auth.{{ .Values.namespacePrefix }}-auth.svc.cluster.local:5001/health;
        }

        location /backend/health {
            proxy_pass http://backend.{{ .Values.namespacePrefix }}-backend.svc.cluster.local:5000/health;
        }

        location = /health {
            return 200 '{"status": "ok", "service": "frontend"}';
        }

        location = /api/health {
            proxy_pass http://auth.{{ .Values.namespacePrefix }}-auth.svc.cluster.local:5001/health;
        }

        location = /grafana {
            return 301 /grafana/;
        }

        location /grafana/ {
            proxy_pass http://grafana.{{ .Values.namespacePrefix }}-monitoring.svc.cluster.local:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /prometheus/ {
            proxy_pass http://prometheus.{{ .Values.namespacePrefix }}-monitoring.svc.cluster.local:9090/prometheus/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }