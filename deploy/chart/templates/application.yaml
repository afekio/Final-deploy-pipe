apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: {{ .Values.namespacePrefix }}-auth
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: auth
          image: {{ .Values.image.registry }}/{{ .Values.image.namespace }}/rke2-auth:{{ .Values.image.tag }}
          ports:
            - name: http
              containerPort: 5001
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HOST
              value: "0.0.0.0"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-auth-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-auth-secrets
                  key: SECRET_KEY
            - name: INTERNAL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-auth-secrets
                  key: INTERNAL_AUTH_SECRET
          volumeMounts:
            - name: logs
              mountPath: /app/logs
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: auth-logs

---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: {{ .Values.namespacePrefix }}-auth
spec:
  selector:
    app: auth
  ports:
    - name: http
      port: 5001
      targetPort: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Values.namespacePrefix }}-backend
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: backend
          image: {{ .Values.image.registry }}/{{ .Values.image.namespace }}/rke2-backend:{{ .Values.image.tag }}
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HOST
              value: "0.0.0.0"
            - name: AUTH_URL
              value: http://auth.{{ .Values.namespacePrefix }}-auth.svc.cluster.local:5001
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-backend-secrets
                  key: SECRET_KEY
            - name: INTERNAL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-backend-secrets
                  key: INTERNAL_AUTH_SECRET
          volumeMounts:
            - name: logs
              mountPath: /app/Logs
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 1Gi
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: backend-logs

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Values.namespacePrefix }}-backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 5000
      targetPort: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ .Values.namespacePrefix }}-frontend
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: {{ .Values.image.registry }}/{{ .Values.image.namespace }}/rke2-frontend:{{ .Values.image.tag }}
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx-conf

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ .Values.namespacePrefix }}-frontend
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80