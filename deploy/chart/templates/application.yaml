apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: {{ .Values.namespacePrefix }}-auth
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: { app: auth }
  template:
    metadata:
      labels: { app: auth }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: auth
          image: {{ .Values.image.registry }}/{{ .Values.image.namespace }}/rke2-auth:{{ .Values.image.tag }}
          ports:
            - name: http
              containerPort: 5001
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-auth-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-auth-secrets
                  key: SECRET_KEY
            - name: INTERNAL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-auth-secrets
                  key: INTERNAL_AUTH_SECRET
            - name: SHARED_DIR
              value: /shared_files
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: files
              mountPath: /shared_files
              subPath: {{ .Values.namespacePrefix }}-shared-data
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 20, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 60, periodSeconds: 10, failureThreshold: 5 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
      volumes:
        - name: logs
          persistentVolumeClaim: { claimName: auth-logs }
        - name: files
          persistentVolumeClaim: { claimName: shared-files-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: {{ .Values.namespacePrefix }}-auth
spec:
  selector: { app: auth }
  ports: [{ name: http, port: 5001, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Values.namespacePrefix }}-backend
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: backend
          image: {{ .Values.image.registry }}/{{ .Values.image.namespace }}/rke2-backend:{{ .Values.image.tag }}
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: AUTH_URL
              value: http://auth.{{ .Values.namespacePrefix }}-auth.svc.cluster.local:5001
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-backend-secrets
                  key: SECRET_KEY
            - name: INTERNAL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-backend-secrets
                  key: INTERNAL_AUTH_SECRET
            - name: SHARED_DIR
              value: /shared_files
          volumeMounts:
            - name: logs
              mountPath: /app/Logs
            - name: files
              mountPath: /shared_files
              subPath: {{ .Values.namespacePrefix }}-shared-data
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 20, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 60, periodSeconds: 10, failureThreshold: 5 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 1, memory: 1Gi } }
      volumes:
        - name: logs
          persistentVolumeClaim: { claimName: backend-logs }
        - name: files
          persistentVolumeClaim: { claimName: shared-files-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Values.namespacePrefix }}-backend
spec:
  selector: { app: backend }
  ports: [{ name: http, port: 5000, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ .Values.namespacePrefix }}-frontend
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: frontend
          image: {{ .Values.image.registry }}/{{ .Values.image.namespace }}/rke2-frontend:{{ .Values.image.tag }}
          ports: [{ name: http, containerPort: 8080 }]
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 10, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 20, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 300m, memory: 256Mi } }
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ .Values.namespacePrefix }}-frontend
spec:
  type: ClusterIP
  selector: { app: frontend }
  ports: [{ name: http, port: 80, targetPort: http }]
---
# ==========================================
# FRONTEND INGRESS (Fallback / React SPA)
# ==========================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: {{ .Values.namespacePrefix }}-frontend
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { name: http } }
---
# ==========================================
# AUTH SERVICE INGRESS (API Routes & Health)
# ==========================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-ingress
  namespace: {{ .Values.namespacePrefix }}-auth
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api/(login|register|user|auth|logout).*
            pathType: ImplementationSpecific
            backend:
              service: { name: auth, port: { name: http } }
          - path: /health
            pathType: Exact
            backend:
              service: { name: auth, port: { name: http } }
          - path: /api/health
            pathType: Exact
            backend:
              service: { name: auth, port: { name: http } }
          - path: /auth/health
            pathType: Exact
            backend:
              service: { name: auth, port: { name: http } }
---
# ==========================================
# BACKEND SERVICE INGRESS (API Routes & Health)
# ==========================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  namespace: {{ .Values.namespacePrefix }}-backend
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api/(provision|transactions|ai|log_error|backend).*
            pathType: ImplementationSpecific
            backend:
              service: { name: backend, port: { name: http } }
          - path: /backend/health
            pathType: Exact
            backend:
              service: { name: backend, port: { name: http } }